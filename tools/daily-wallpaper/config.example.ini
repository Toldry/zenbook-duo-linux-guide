# Settings for daily-wallpaper. Changes take effect within a minute.

[wallpaper]
# Folder with your wallpapers. "~" means your home folder.
folder = ~/Pictures/Wallpapers

# Time of day (24-hour, HH:MM) when new pictures are picked.
change_time = 00:00

# Also use images in folders inside the folder above: yes or no.
include_subfolders = yes
